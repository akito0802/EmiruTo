services:
  - type: web
    name: emiruto-push-api
    runtime: node
    plan: free
    region: singapore
    rootDir: push-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emiruto-push-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://akito0802.github.io

databases:
  - name: emiruto-push-db
    databaseName: emiruto_push_db
    user: emiruto_push_db_user
    plan: free
    region: singapore
    postgresMajorVersion: "18"
